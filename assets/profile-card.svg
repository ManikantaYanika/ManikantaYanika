  <text x="47" y="531" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">ESG</text>

  <rect x="78" y="516" width="48" height="22" rx="11" fill="#161b22" stroke="#30363d" stroke-width="0.5"/>
  <text x="102" y="531" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">RAG</text>

  <rect x="134" y="516" width="86" height="22" rx="11" fill="#161b22" stroke="#30363d" stroke-width="0.5"/>
  <text x="177" y="531" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Automation</text>

