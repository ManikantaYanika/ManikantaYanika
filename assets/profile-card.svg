  <text x="130" y="252" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle">Building real-world AI apps,</text>
  <text x="130" y="268" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle">intelligent automation &amp;</text>
  <text x="130" y="284" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle">scalable business platforms.</text>

