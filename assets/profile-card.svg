  <rect x="24" y="544" width="58" height="22" rx="11" fill="#161b22" stroke="#30363d" stroke-width="0.5"/>
  <text x="53" y="559" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Python</text>

  <rect x="90" y="544" width="66" height="22" rx="11" fill="#161b22" stroke="#30363d" stroke-width="0.5"/>
  <text x="123" y="559" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Node.js</text>

  <rect x="164" y="544" width="70" height="22" rx="11" fill="#161b22" stroke="#30363d" stroke-width="0.5"/>
