  <circle cx="130" cy="68" r="42" fill="#161b22"/>
  <text x="130" y="78" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="600" fill="#06b6d4" text-anchor="middle" letter-spacing="2">MY</text>

