<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4" />
      <stop offset="100%" style="stop-color:#8b5cf6" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="300" fill="url(#bg)" rx="0"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="50" x2="900" y2="50" stroke="#06b6d4" stroke-width="0.5"/>
    <line x1="0" y1="100" x2="900" y2="100" stroke="#06b6d4" stroke-width="0.5"/>
    <line x1="0" y1="150" x2="900" y2="150" stroke="#06b6d4" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="900" y2="200" stroke="#06b6d4" stroke-width="0.5"/>
    <line x1="0" y1="250" x2="900" y2="250" stroke="#06b6d4" stroke-width="0.5"/>
    <line x1="150" y1="0" x2="150" y2="300" stroke="#06b6d4" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="300" stroke="#06b6d4" stroke-width="0.5"/>
    <line x1="450" y1="0" x2="450" y2="300" stroke="#06b6d4" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="300" stroke="#06b6d4" stroke-width="0.5"/>
    <line x1="750" y1="0" x2="750" y2="300" stroke="#06b6d4" stroke-width="0.5"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="80" cy="60" r="80" fill="#06b6d4" opacity="0.03"/>
  <circle cx="820" cy="240" r="100" fill="#8b5cf6" opacity="0.03"/>
  <circle cx="450" cy="150" r="180" fill="#06b6d4" opacity="0.015"/>

  <!-- Accent line top -->
  <rect x="0" y="0" width="900" height="2" fill="url(#accent)" opacity="0.6"/>

  <!-- Name -->
  <text x="450" y="115" font-family="'Segoe UI', Arial, sans-serif" font-size="42" font-weight="700" fill="#e2e8f0" text-anchor="middle" letter-spacing="1">Manikanta Yanika</text>

  <!-- Role -->
  <text x="450" y="158" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="url(#textGrad)" text-anchor="middle" letter-spacing="2">AI PRODUCT BUILDER  ·  FULL-STACK DEVELOPER</text>

  <!-- Tagline -->
  <text x="450" y="195" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="300" fill="#94a3b8" text-anchor="middle" letter-spacing="1">Building real-world AI applications &amp; scalable business platforms</text>

  <!-- Location line -->
  <text x="450" y="230" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="300" fill="#64748b" text-anchor="middle" letter-spacing="1">Bangalore, India  ·  Revify Private Limited</text>

  <!-- Accent line bottom -->
  <rect x="0" y="298" width="900" height="2" fill="url(#accent)" opacity="0.6"/>

  <!-- Corner accents -->
  <rect x="30" y="30" width="30" height="1" fill="#06b6d4" opacity="0.3"/>
  <rect x="30" y="30" width="1" height="30" fill="#06b6d4" opacity="0.3"/>
  <rect x="840" y="270" width="30" height="1" fill="#8b5cf6" opacity="0.3"/>
  <rect x="869" y="240" width="1" height="30" fill="#8b5cf6" opacity="0.3"/>
</svg>
